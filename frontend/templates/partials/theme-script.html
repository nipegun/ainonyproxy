  {#
    Theme switch, shared by every page. It needs the page to define
    fTranslateOr() and fEscapeHtml(), and an element with id="theme-switch".
    The page calls fRenderThemeSwitch() after loading its texts.
  #}
  <script>
    // "auto" follows the system theme (and changes with it); "light" and "dark" are fixed
    var cThemeStorageKey = 'ainonyproxy_theme';
    var aThemeOptions = [
      {
        value: 'auto',
        key: 'theme.auto',
        fallback: 'System',
        icon: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="1.75" y="2.5" width="12.5" height="8.5" rx="1.25"/><path d="M5.5 13.75h5"/><path d="M8 11v2.75"/></svg>'
      },
      {
        value: 'light',
        key: 'theme.light',
        fallback: 'Light',
        icon: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="2.75"/><path d="M8 1.5v1.25M8 13.25v1.25M1.5 8h1.25M13.25 8h1.25M3.4 3.4l.9.9M11.7 11.7l.9.9M3.4 12.6l.9-.9M11.7 4.3l.9-.9"/></svg>'
      },
      {
        value: 'dark',
        key: 'theme.dark',
        fallback: 'Dark',
        icon: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 9.75A5.75 5.75 0 0 1 6.25 2.5a5.75 5.75 0 1 0 7.25 7.25z"/></svg>'
      }
    ];

    function fGetSavedTheme() {
      var vTheme = null;
      try { vTheme = localStorage.getItem(cThemeStorageKey); } catch (vError) {}
      return vTheme === 'light' || vTheme === 'dark' ? vTheme : 'auto';
    }

    function fApplyTheme(pTheme) {
      if (pTheme === 'light' || pTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', pTheme);
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
    }

    function fSetTheme(pTheme) {
      try {
        if (pTheme === 'light' || pTheme === 'dark') {
          localStorage.setItem(cThemeStorageKey, pTheme);
        } else {
          localStorage.removeItem(cThemeStorageKey);
        }
      } catch (vError) {}
      fApplyTheme(pTheme);
      fRenderThemeSwitch();
    }

    function fRenderThemeSwitch() {
      var vContainer = document.getElementById('theme-switch');
      if (!vContainer) return;
      var vCurrentTheme = fGetSavedTheme();
      vContainer.setAttribute('aria-label', fTranslateOr('theme.label', 'Theme'));
      vContainer.innerHTML = aThemeOptions.map(function(pOption) {
        var vLabel = fEscapeHtml(fTranslateOr(pOption.key, pOption.fallback));
        var vIsActive = pOption.value === vCurrentTheme;
        return '<button type="button" class="theme-option' + (vIsActive ? ' active' : '') + '"' +
          ' data-theme-value="' + pOption.value + '" title="' + vLabel + '" aria-label="' + vLabel + '"' +
          ' aria-pressed="' + (vIsActive ? 'true' : 'false') + '">' + pOption.icon + '</button>';
      }).join('');
      vContainer.querySelectorAll('.theme-option').forEach(function(pButton) {
        pButton.addEventListener('click', function() { fSetTheme(pButton.getAttribute('data-theme-value')); });
      });
    }

    // Another tab of this browser changed the theme
    window.addEventListener('storage', function(pEvent) {
      if (pEvent.key === cThemeStorageKey) {
        fApplyTheme(fGetSavedTheme());
        fRenderThemeSwitch();
      }
    });
  </script>
